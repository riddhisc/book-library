<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Library</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#eceff4;--surf:#fff;--ink:#17203a;--mute:#5d6783;--line:#d5dbe7;--acc:#2f5bea;--accink:#fff;--danger:#c0392b;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#12151d;--surf:#1b2030;--ink:#e8ecf7;--mute:#9aa4bf;--line:#2c3350;--acc:#7d9bff;--accink:#0e1220;--danger:#ff7b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151d;--surf:#1b2030;--ink:#e8ecf7;--mute:#9aa4bf;--line:#2c3350;--acc:#7d9bff;--accink:#0e1220;--danger:#ff7b6b;color-scheme:dark}
:root[data-theme="midnight"]{--bg:#0b1226;--surf:#131c38;--ink:#e6ecff;--mute:#94a3d0;--line:#263259;--acc:#5ea0ff;--accink:#06122b;--danger:#ff7b7b;color-scheme:dark}
:root[data-theme="forest"]{--bg:#0f1a15;--surf:#16251e;--ink:#e4f1e8;--mute:#93ae9f;--line:#26382e;--acc:#4fd19a;--accink:#04170e;--danger:#ff8a76;color-scheme:dark}
:root[data-theme="amoled"]{--bg:#000;--surf:#0d0d0d;--ink:#f2f2f2;--mute:#9a9a9a;--line:#262626;--acc:#8ab4ff;--accink:#000;--danger:#ff7b6b;color-scheme:dark}
:root[data-theme="rose"]{--bg:#fbeff2;--surf:#fff;--ink:#3a1c28;--mute:#86596b;--line:#ecd0d9;--acc:#c72a63;--accink:#fff;--danger:#b3321f;color-scheme:light}
:root[data-theme="ocean"]{--bg:#e6f3f5;--surf:#fff;--ink:#0d2f38;--mute:#4d7480;--line:#c3dde2;--acc:#077a90;--accink:#fff;--danger:#b3321f;color-scheme:light}
:root[data-theme="lavender"]{--bg:#f0eefb;--surf:#fff;--ink:#231d45;--mute:#6a6591;--line:#d8d4f0;--acc:#6a4bdb;--accink:#fff;--danger:#b3321f;color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",sans-serif;margin:0;line-height:1.1}
main{max-width:1000px;margin:0 auto;padding:28px 20px 60px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin-bottom:28px}
.top h1{font-size:clamp(30px,6vw,44px);font-weight:700;letter-spacing:-.02em}
.sub{margin:4px 0 0;color:var(--mute);font-size:15px}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surf);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:22px}
.card{position:relative;aspect-ratio:3/4;border-radius:4px 10px 10px 4px;color:#fff;cursor:pointer;overflow:hidden;
background:linear-gradient(180deg,hsl(var(--h) 46% 36%),hsl(var(--h) 50% 27%));box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 8px 18px -8px hsl(var(--h) 60% 15% / .7);
display:flex;flex-direction:column;justify-content:flex-end;padding:18px 16px 16px 30px;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card::before{content:"";z-index:2;position:absolute;left:0;top:0;bottom:0;width:15px;background:hsl(var(--h) 50% 20%);box-shadow:inset -2px 0 0 rgba(255,255,255,.14)}
.card h2{font-size:23px;font-weight:700;overflow-wrap:anywhere;letter-spacing:-.01em}
.card p{margin:8px 0 0;font-size:13px;opacity:.82}
.acts{position:absolute;z-index:3;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.card:hover .acts,.card:focus-within .acts,.row:hover .acts,.row:focus-within .acts{opacity:1}
@media (hover:none){.acts{opacity:1}}
.mini{border:0;background:rgba(0,0,0,.35);color:#fff;border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer}
.mini:hover{background:rgba(0,0,0,.6)}
.row .mini{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.row .mini.del:hover{color:var(--danger);border-color:var(--danger)}
.back{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;margin-bottom:14px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;margin:8px 0 0;font-size:15px;color:var(--mute)}
.crumbs button{border:0;background:none;padding:2px 4px;cursor:pointer;color:var(--acc);font-weight:500;border-radius:4px}
.crumbs span.cur{color:var(--ink);font-weight:600}
.list{display:grid;gap:8px;margin-top:22px}
.row{display:flex;align-items:center;gap:14px;background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.row:hover{border-color:var(--acc)}
.row svg{flex:none;width:26px;height:26px}
.row .nm{font-weight:600;overflow-wrap:anywhere}
.row .mt{color:var(--mute);font-size:13px}
.row .acts{position:static}
.drop{border:2px dashed var(--line);border-radius:12px;padding:44px 20px;text-align:center;color:var(--mute);margin-top:22px}
.empty{padding:54px 20px;text-align:center;color:var(--mute);max-width:430px;margin:20px auto}
.empty h2{color:var(--ink);font-size:24px;margin-bottom:8px}
body.dragging main{outline:3px dashed var(--acc);outline-offset:-8px}
.ov{position:fixed;inset:0;background:rgba(10,14,28,.6);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.dlg{background:var(--surf);border-radius:12px;padding:22px;width:min(420px,100%);display:grid;gap:14px}
.dlg h3{font-size:21px}.dlg p{margin:0;color:var(--mute)}.err{color:var(--danger);font-size:14px;margin-top:-6px}
.dlg input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;width:100%}
.dlg .row2{display:flex;justify-content:flex-end;gap:8px}
.view{background:var(--surf);border-radius:12px;width:min(960px,100%);height:min(88vh,100%);display:flex;flex-direction:column;overflow:hidden}
.view header{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.view header b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view iframe{flex:1;border:0;width:100%;background:#fff}
.view a{color:var(--acc);font-weight:500}
#note{background:var(--surf);border:1px solid var(--danger);color:var(--danger);padding:10px 14px;border-radius:8px;margin-bottom:18px;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30}
.search{width:100%;border:1px solid var(--line);background:var(--surf);border-radius:10px;padding:11px 14px;margin:-6px 0 24px}
#app.searching .shelf,#app.searching .empty{display:none}
.list:empty{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:20px;margin-top:22px}
.tile{cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative}
.cov{aspect-ratio:3/4;border-radius:3px 7px 7px 3px;background:var(--surf) center/cover no-repeat;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px -8px rgba(0,0,0,.5);overflow:hidden}
.cov svg{width:38px;height:38px}
.tile:hover .cov{border-color:var(--acc)}
.tile .nm{font-weight:600;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.tile .mt{color:var(--mute);font-size:12px}
.tile .acts{top:6px;right:6px;flex-direction:column;align-items:flex-end}
.hit .mt{overflow-wrap:anywhere}
.sumpanel{padding:14px 16px;border-bottom:1px solid var(--line);max-height:42%;overflow:auto;background:var(--bg)}
.sumpanel p{margin:0}
.sumtext{white-space:pre-wrap;max-width:70ch}
.sumbar{display:flex;gap:8px;margin-top:12px}
a.btn{display:inline-block;text-decoration:none;color:inherit}
.view a.btn.pri{color:var(--accink)}
a.row{color:inherit;text-decoration:none}
.card.has-cover{background-color:hsl(var(--h) 48% 30%);background-size:cover;background-position:center}
.card.has-cover h2,.card.has-cover p{text-shadow:0 1px 6px rgba(0,0,0,.6)}
.card .acts{flex-direction:column;align-items:flex-end}
.set{width:min(520px,100%)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0 0;border-top:1px solid var(--line)}
.srow p{font-size:14px}
.dlg .srow select{width:auto}
.dlg select,.dlg input,.search{color:var(--ink)}
.search::placeholder,.dlg input::placeholder{color:var(--mute);opacity:1}
select option{background:var(--surf);color:var(--ink)}
.dlg select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;width:100%}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<main>
  <div id="note" hidden>Storage isn’t available in this browser, so files will be lost when you close the page.</div>
  <div id="app"></div><input type="file" id="covpick" accept="image/*" hidden>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
const fmt=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(0)+' KB':(b/1048576).toFixed(1)+' MB';

/* ---------- storage (IndexedDB, with in-memory fallback) ---------- */
let persistent=true;
const mem={topics:new Map(),nodes:new Map(),blobs:new Map()};
let dbp;
try{
  dbp=new Promise((res,rej)=>{
    const r=indexedDB.open('book-library',1);
    r.onupgradeneeded=()=>{const d=r.result;['topics','nodes','blobs'].forEach(n=>d.createObjectStore(n,{keyPath:'id'}))};
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
  });
}catch(e){dbp=Promise.reject(e)}
dbp.catch(()=>fail());
function fail(){persistent=false;$('#note').hidden=false}
async function idb(name,mode,fn){
  const d=await dbp;
  return new Promise((res,rej)=>{
    const t=d.transaction(name,mode);const r=fn(t.objectStore(name));
    t.oncomplete=()=>res(r&&r.result);t.onerror=t.onabort=()=>rej(t.error);
  });
}
async function getAll(n){if(persistent)try{return await idb(n,'readonly',s=>s.getAll())}catch(e){fail()}return [...mem[n].values()]}
async function getOne(n,id){if(persistent)try{return await idb(n,'readonly',s=>s.get(id))}catch(e){fail()}return mem[n].get(id)}
async function put(n,o){if(persistent)try{return await idb(n,'readwrite',s=>s.put(o))}catch(e){fail()}mem[n].set(o.id,o)}
async function del(n,id){if(persistent)try{return await idb(n,'readwrite',s=>s.delete(id))}catch(e){fail()}mem[n].delete(id)}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------- state ---------- */
let topics=[],nodes=[];
let cur={topic:null,path:[]}; // path = folder ids
let q='';
const kids=(topicId,parent)=>nodes.filter(n=>n.topicId===topicId&&n.parentId===parent);
function descendants(id){const out=[];(function walk(p){nodes.filter(n=>n.parentId===p).forEach(n=>{out.push(n);if(n.type==='folder')walk(n.id)})})(id);return out}
const hueFor=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};

/* ---------- ui helpers ---------- */
function dlg({title,label,value='',ok='Save',input=true,danger=false,body='',options=null}){
  return new Promise(res=>{
    const o=document.createElement('div');o.className='ov';
    o.innerHTML=`<form class="dlg"><h3>${esc(title)}</h3>${body?`<p>${esc(body)}</p>`:''}${input?`<input name="v" value="${esc(value)}" maxlength="80" autocomplete="off" aria-label="${esc(label||title)}"><small class="err" role="alert" hidden>Type a name first.</small>`:''}${options?`<select name="s" aria-label="Destination">${options.map(o=>`<option value="${esc(o.v)}"${o.v===value?' selected':''}>${esc(o.l)}</option>`).join('')}</select>`:''}<div class="row2"><button type="button" class="btn ghost" data-x>Cancel</button><button class="btn ${danger?'danger':'pri'}">${esc(ok)}</button></div></form>`;
    document.body.append(o);
    const f=o.firstChild,i=f.elements.v;
    if(i){i.focus();i.select()}else f.querySelector('button:last-child').focus();
    const done=v=>{o.remove();res(v)};
    f.onsubmit=e=>{e.preventDefault();if(input&&!i.value.trim()){f.querySelector('.err').hidden=false;i.focus();return}done(options?f.elements.s.value:input?i.value.trim():true)};
    o.onclick=e=>{if(e.target===o||e.target.hasAttribute('data-x'))done(null)};
    o.onkeydown=e=>{if(e.key==='Escape')done(null)};
  });
}
let tt;function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.append(t)}t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200)}
const iFolder='<svg viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
const iFile='<svg viewBox="0 0 24 24" fill="none" stroke="var(--mute)" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/></svg>';

/* ---------- render ---------- */
function render(){
  const app=$('#app');
  if(!cur.topic){
    const files=nodes.filter(n=>n.type==='file').length;
    app.innerHTML=`<div class="top"><div class="grow"><h1>My library</h1><p class="sub">${plural(topics.length,'topic')}, ${plural(files,'file')}</p></div><button class="btn" data-act="settings">Settings</button><input type="file" id="rest" hidden><button class="btn pri" data-act="newTopic">New topic</button></div><input class="search" id="q" type="search" placeholder="Search topics, folders and books" aria-label="Search topics, folders and books"><div id="res"></div>`+
    (topics.length?`<div class="shelf">${topics.map(t=>{
      const all=nodes.filter(n=>n.topicId===t.id);
      return `<article class="card${t.cover?' has-cover':''}" tabindex="0" role="button" data-act="open" data-id="${t.id}" style="--h:${t.hue}${t.cover?`;background-image:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.8)),url('${t.cover}')`:''}" aria-label="Open ${esc(t.name)}">
        <div class="acts"><button class="mini" data-act="renameTopic" data-id="${t.id}">Rename</button><button class="mini" data-act="cover" data-id="${t.id}">${t.cover?'Change cover':'Add cover'}</button>${t.cover?`<button class="mini" data-act="coverRemove" data-id="${t.id}">Remove cover</button>`:''}<button class="mini" data-act="delTopic" data-id="${t.id}">Delete</button></div>
        <h2>${esc(t.name)}</h2><p>${plural(all.filter(n=>n.type==='folder').length,'folder')}, ${plural(all.filter(n=>n.type==='file').length,'file')}</p></article>`}).join('')}</div>`
    :`<div class="empty"><h2>Start with a topic</h2><p>Make a card for a subject, like TypeScript. Open it to add folders and upload your book PDFs.</p></div>`);
    wireHome();
    return;
  }
  const t=topics.find(x=>x.id===cur.topic);
  const parent=cur.path.length?cur.path[cur.path.length-1]:null;
  const items=kids(t.id,parent).sort((a,b)=>(a.type===b.type?0:a.type==='folder'?-1:1)||a.name.localeCompare(b.name,undefined,{numeric:true}));
  const tileList=items.filter(n=>n.type==='file').map(n=>`<div class="tile" tabindex="0" role="button" data-act="view" data-id="${n.id}"><div class="cov"${n.thumb?` style="background-image:url(${n.thumb})"`:''}>${n.thumb?'':iFile}</div><div class="nm">${esc(n.name)}</div><div class="mt">${fmt(n.size)}</div><div class="acts"><button class="mini" data-act="rename" data-id="${n.id}">Rename</button><button class="mini" data-act="move" data-id="${n.id}">Move</button><button class="mini del" data-act="del" data-id="${n.id}">Delete</button></div></div>`).join('');
  const crumbs=[`<button data-act="home">All topics</button>`,
    cur.path.length?`<button data-act="crumb" data-i="-1">${esc(t.name)}</button>`:`<span class="cur">${esc(t.name)}</span>`];
  cur.path.forEach((id,i)=>{const f=nodes.find(n=>n.id===id);if(!f)return;crumbs.push(i===cur.path.length-1?`<span class="cur">${esc(f.name)}</span>`:`<button data-act="crumb" data-i="${i}">${esc(f.name)}</button>`)});
  app.innerHTML=`<div class="top"><div class="grow"><button class="btn back" data-act="back" aria-label="${parent?'Back to parent folder':'Back to all topics'}"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Back</button><h1>${esc(parent?nodes.find(n=>n.id===parent).name:t.name)}</h1><nav class="crumbs" aria-label="Location">${crumbs.join('<span>/</span>')}</nav></div>
    <button class="btn" data-act="newFolder">New folder</button><button class="btn pri" data-act="upload">Add PDFs</button><input type="file" id="pick" accept=".pdf,application/pdf" multiple hidden></div>`+
    (items.length?`<div class="list">${items.filter(n=>n.type==='folder').map(n=>`<div class="row" tabindex="0" role="button" data-act="${n.type==='folder'?'enter':'view'}" data-id="${n.id}">
      ${n.type==='folder'?iFolder:iFile}<div class="grow"><div class="nm">${esc(n.name)}</div><div class="mt">${n.type==='folder'?plural(nodes.filter(k=>k.parentId===n.id).length,'item'):fmt(n.size)}</div></div>
      <div class="acts"><button class="mini" data-act="rename" data-id="${n.id}">Rename</button><button class="mini" data-act="move" data-id="${n.id}">Move</button><button class="mini del" data-act="del" data-id="${n.id}">Delete</button></div></div>`).join('')}</div><div class="tiles">${tileList}</div>`
    :`<div class="drop">This ${parent?'folder':'topic'} is empty. Drop PDFs anywhere on the page, or use Add PDFs.</div>`);
  $('#pick').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
  queueThumbs();
}

/* ---------- actions ---------- */
async function addFiles(files){
  if(!cur.topic)return;
  const parent=cur.path.length?cur.path[cur.path.length-1]:null;
  let ok=0,skip=0;
  for(const f of files){
    if(!(f.type==='application/pdf'||/\.pdf$/i.test(f.name))){skip++;continue}
    const n={id:uid(),topicId:cur.topic,parentId:parent,type:'file',name:f.name.replace(/\.pdf$/i,''),size:f.size,added:Date.now()};
    await put('blobs',{id:n.id,blob:f});await put('nodes',n);nodes.push(n);ok++;
  }
  render();
  toast((ok?`Added ${plural(ok,'PDF')}.`:'')+(skip?` ${plural(skip,'file')} skipped: only PDFs are supported.`:''));
}
async function openFile(id){
  const n=nodes.find(x=>x.id===id),rec=await getOne('blobs',id);
  if(!rec){toast('Couldn’t find that file’s data.');return}
  const url=URL.createObjectURL(rec.blob);
  const o=document.createElement('div');o.className='ov';
  o.innerHTML=`<div class="view" role="dialog" aria-label="${esc(n.name)}"><header><b>${esc(n.name)}</b><button class="btn" data-sum>${n.summary?'Summary':'Summarise'}</button><a href="${url}" target="_blank" rel="noopener">Open in new tab</a><button class="btn" data-x>Close</button></header><div class="sumpanel" hidden></div><iframe src="${url}" title="${esc(n.name)}"></iframe></div>`;
  document.body.append(o);
  const close=()=>{o.remove();URL.revokeObjectURL(url)};
  o.onclick=e=>{const b=e.target.closest('button,a'),pn=o.querySelector('.sumpanel');if(e.target===o||(b&&b.hasAttribute('data-x')))close();else if(b&&b.hasAttribute('data-sum'))runSummary(n,pn);else if(b&&b.hasAttribute('data-redo'))runSummary(n,pn,true);else if(b&&b.hasAttribute('data-copy'))navigator.clipboard.writeText(n.summary||'').then(()=>toast('Copied.'),()=>toast('Couldn’t copy.'))};
  o.onkeydown=e=>{if(e.key==='Escape')close()};
  o.querySelector('button').focus();
}
async function removeNodes(list){for(const n of list){await del('nodes',n.id);if(n.type==='file')await del('blobs',n.id)}const ids=new Set(list.map(n=>n.id));nodes=nodes.filter(n=>!ids.has(n.id))}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,id=el.dataset.id;
  if(el.matches('.mini'))e.stopPropagation();
  if(act==='newTopic'){const name=await dlg({title:'New topic',label:'Topic name',ok:'Create'});if(name){const t={id:uid(),name,hue:hueFor(name),created:Date.now()};await put('topics',t);topics.push(t);render()}}
  else if(act==='open'){cur={topic:id,path:[]};render();scrollTo(0,0)}
  else if(act==='renameTopic'){const t=topics.find(x=>x.id===id);const name=await dlg({title:'Rename topic',value:t.name});if(name){t.name=name;await put('topics',t);render()}}
  else if(act==='delTopic'){const t=topics.find(x=>x.id===id);if(await dlg({title:`Delete “${t.name}”?`,body:'This removes the topic and every folder and PDF inside it from this browser.',ok:'Delete',input:false,danger:true})){await removeNodes(nodes.filter(n=>n.topicId===id));await del('topics',id);topics=topics.filter(x=>x.id!==id);render()}}
  else if(act==='move'){moveNode(nodes.find(x=>x.id===id))}
  else if(act==='hitTopic'){q='';cur={topic:id,path:[]};render();scrollTo(0,0)}
  else if(act==='hit'){const n=nodes.find(x=>x.id===id);q='';cur={topic:n.topicId,path:[...anc(n),...(n.type==='folder'?[n.id]:[])]};render();scrollTo(0,0);if(n.type==='file')openFile(n.id)}
  else if(act==='cover'){coverFor=id;$('#covpick').click()}
  else if(act==='coverRemove'){const t=topics.find(x=>x.id===id);delete t.cover;await put('topics',t);render()}
  else if(act==='saveKey'){const v=$('#akey').value.trim();try{v?localStorage.setItem('lib-key',v):localStorage.removeItem('lib-key')}catch(e){}toast(v?'Key saved.':'Key removed.')}
  else if(act==='settings'){openSettings()}
  else if(act==='covers'){for(const n of nodes.filter(x=>x.type==='file')){delete n.thumb;delete n.nothumb;await put('nodes',n)}toast('Covers will rebuild when you open each topic.')}
  else if(act==='wipe'){const s=document.getElementById('settings');if(s)s.remove();if(await dlg({title:'Delete everything?',body:'This permanently removes all topics, folders and PDFs from this browser. Back up first if you may want them again.',ok:'Delete everything',input:false,danger:true})){await removeNodes([...nodes]);for(const t of topics)await del('topics',t.id);topics=[];nodes=[];render()}}
  else if(act==='backup'){backup()}
  else if(act==='restore'){$('#rest').click()}
  else if(act==='back'){if(cur.path.length)cur.path.pop();else cur={topic:null,path:[]};render();scrollTo(0,0)}
  else if(act==='home'){cur={topic:null,path:[]};render()}
  else if(act==='crumb'){cur.path=cur.path.slice(0,+el.dataset.i+1);render()}
  else if(act==='enter'){cur.path.push(id);render()}
  else if(act==='view'){openFile(id)}
  else if(act==='upload'){$('#pick').click()}
  else if(act==='newFolder'){const name=await dlg({title:'New folder',label:'Folder name',ok:'Create'});if(name){const n={id:uid(),topicId:cur.topic,parentId:cur.path.length?cur.path[cur.path.length-1]:null,type:'folder',name,size:0,added:Date.now()};await put('nodes',n);nodes.push(n);render()}}
  else if(act==='rename'){const n=nodes.find(x=>x.id===id);const name=await dlg({title:'Rename',value:n.name});if(name){n.name=name;await put('nodes',n);render()}}
  else if(act==='del'){const n=nodes.find(x=>x.id===id);const sub=n.type==='folder'?descendants(id):[];if(await dlg({title:`Delete “${n.name}”?`,body:n.type==='folder'?`This also deletes ${plural(sub.length,'item')} inside it.`:'This removes the PDF from this browser.',ok:'Delete',input:false,danger:true})){await removeNodes([n,...sub]);render()}}
});

let dc=0;

addEventListener('dragleave',()=>{if(--dc<=0){dc=0;document.body.classList.remove('dragging')}});

const anc=n=>{const a=[];let x=nodes.find(k=>k.id===n.parentId);while(x){a.unshift(x.id);x=nodes.find(k=>k.id===x.parentId)}return a};
function wireHome(){const qi=$('#q');qi.value=q;qi.oninput=()=>{q=qi.value;doSearch()};doSearch();$('#rest').onchange=e=>{restore(e.target.files[0]);e.target.value=''}}
function doSearch(){
  const r=$('#res');if(!r)return;const s=q.trim().toLowerCase();$('#app').classList.toggle('searching',!!s);
  if(!s){r.innerHTML='';return}
  const hits=nodes.filter(n=>n.name.toLowerCase().includes(s)).slice(0,50);
  const tm=topics.filter(t=>t.name.toLowerCase().includes(s));
  const iBook='<svg viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="1.8" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>';
  r.innerHTML=(hits.length||tm.length)?`<div class="list">${tm.map(t=>`<div class="row hit" tabindex="0" role="button" data-act="hitTopic" data-id="${t.id}">${iBook}<div class="grow"><div class="nm">${esc(t.name)}</div><div class="mt">Topic</div></div></div>`).join('')}${hits.map(n=>{const t=topics.find(x=>x.id===n.topicId);const where=[t&&t.name,...anc(n).map(id=>nodes.find(k=>k.id===id).name)].join(' / ');return `<div class="row hit" tabindex="0" role="button" data-act="hit" data-id="${n.id}">${n.type==='folder'?iFolder:iFile}<div class="grow"><div class="nm">${esc(n.name)}</div><div class="mt">${esc(where)}</div></div></div>`}).join('')}</div>`:`<p class="sub">No matches for “${esc(q)}”.</p>`;
  const en=encodeURIComponent(q.trim()),qq=esc(q.trim());
  const iSearch='<svg viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>';
  const iAI='<svg viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2.3 6.2L21 12l-6.7 2.8L12 21l-2.3-6.2L3 12l6.7-2.8z"/></svg>';
  r.insertAdjacentHTML('beforeend',`<div class="list"><a class="row hit" href="https://www.google.com/search?q=${en}" target="_blank" rel="noopener">${iSearch}<div class="grow"><div class="nm">Search Google for “${qq}”</div><div class="mt">Opens in a new tab</div></div></a><a class="row hit" href="https://claude.ai/new?q=${en}" target="_blank" rel="noopener">${iAI}<div class="grow"><div class="nm">Ask Claude about “${qq}”</div><div class="mt">Opens in a new tab</div></div></a></div>`);
}
async function moveNode(n){
  const bad=new Set([n.id,...descendants(n.id).map(d=>d.id)]);
  const t=topics.find(x=>x.id===n.topicId);
  const opts=[{v:'',l:t.name+' (top level)'},...nodes.filter(f=>f.topicId===n.topicId&&f.type==='folder'&&!bad.has(f.id)).map(f=>({v:f.id,l:[t.name,...[...anc(f),f.id].map(id=>nodes.find(k=>k.id===id).name)].join(' / ')}))];
  const dest=await dlg({title:`Move “${n.name}”`,ok:'Move',input:false,options:opts,value:n.parentId||''});
  if(dest===null)return;
  n.parentId=dest||null;await put('nodes',n);render();toast('Moved.');
}
let thumbBusy=false;
async function makeThumb(blob){
  if(!window.pdfjsLib)return null;
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise;
  const pg=await pdf.getPage(1),v0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:260/v0.width});
  const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
  await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  pdf.destroy();return c.toDataURL('image/jpeg',.7);
}
async function queueThumbs(){
  if(thumbBusy||!cur.topic)return;thumbBusy=true;
  try{for(const n of nodes.filter(x=>x.type==='file'&&x.topicId===cur.topic&&!x.thumb&&!x.nothumb)){
    try{const r=await getOne('blobs',n.id);n.thumb=r?await makeThumb(r.blob):null}catch(e){n.thumb=null}
    if(!n.thumb)n.nothumb=1;
    await put('nodes',n);if(cur.topic&&n.topicId===cur.topic)render();
  }}finally{thumbBusy=false}
}
async function backup(){
  const order=[],parts=[];
  for(const n of nodes.filter(x=>x.type==='file')){const r=await getOne('blobs',n.id);if(r){order.push([n.id,r.blob.size]);parts.push(r.blob)}}
  const m=new TextEncoder().encode(JSON.stringify({v:1,topics,nodes,order}));
  const url=URL.createObjectURL(new Blob([String(m.length).padStart(10,'0'),m,...parts]));
  const a=document.createElement('a');a.href=url;a.download='library-backup-'+new Date().toISOString().slice(0,10)+'.lib';document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);toast('Backup file downloaded.');
}
async function restore(f){
  if(!f)return;
  try{
    const len=+(await f.slice(0,10).text());const meta=JSON.parse(await f.slice(10,10+len).text());
    let off=10+len;
    for(const [id,size] of meta.order){await put('blobs',{id,blob:f.slice(off,off+size,'application/pdf')});off+=size}
    for(const t of meta.topics)await put('topics',t);
    for(const n of meta.nodes)await put('nodes',n);
    topics=(await getAll('topics')).sort((a,b)=>a.created-b.created);nodes=await getAll('nodes');render();
    toast(`Restored ${plural(meta.topics.length,'topic')} and ${plural(meta.order.length,'file')}.`);
  }catch(e){toast('That doesn’t look like a library backup file.')}
}
let theme='';try{theme=localStorage.getItem('lib-theme')||''}catch(e){}
function applyTheme(v){if(v)document.documentElement.dataset.theme=v;else delete document.documentElement.dataset.theme}
applyTheme(theme);
async function openSettings(){
  const files=nodes.filter(n=>n.type==='file'),total=files.reduce((s,n)=>s+n.size,0);
  let quota='';try{const e=await navigator.storage.estimate();if(e.quota)quota=` of about ${fmt(e.quota)} available`}catch(err){}
  const o=document.createElement('div');o.className='ov';o.id='settings';
  o.innerHTML=`<div class="dlg set" role="dialog" aria-label="Settings"><h3>Settings</h3>
  <div class="srow"><div><b>Theme</b><p>Choose light or dark, or match your device.</p></div><select id="th" aria-label="Theme"><option value="">Match device</option><option value="light">Light</option><option value="dark">Dark</option><option value="midnight">Midnight blue</option><option value="forest">Forest green</option><option value="amoled">Black</option><option value="rose">Rose</option><option value="ocean">Ocean</option><option value="lavender">Lavender</option></select></div>
  <div class="srow"><div><b>Storage</b><p>${fmt(total)} used by ${plural(files.length,'PDF')}${quota}.</p></div></div>
  <div class="srow"><div class="grow"><b>Claude API key</b><p>Optional. Turns on AI summaries on your own site. Saved only in this browser.</p><input id="akey" type="password" placeholder="sk-ant-…" autocomplete="off" aria-label="Claude API key"></div><button class="btn" data-act="saveKey">Save</button></div>
  <div class="srow"><div><b>Back up</b><p>Download everything as one file.</p></div><button class="btn" data-act="backup">Back up</button></div>
  <div class="srow"><div><b>Restore</b><p>Add the topics and books from a backup file.</p></div><button class="btn" data-act="restore">Restore</button></div>
  <div class="srow"><div><b>Rebuild covers</b><p>Make fresh cover images for all PDFs.</p></div><button class="btn" data-act="covers">Rebuild</button></div>
  <div class="srow"><div><b>Delete everything</b><p>Remove all topics and PDFs from this browser.</p></div><button class="btn danger" data-act="wipe">Delete</button></div>
  <div class="row2"><button class="btn pri" data-x>Done</button></div></div>`;
  document.body.append(o);
  const th=o.querySelector('#th');th.value=theme;o.querySelector('#akey').value=getKey();
  th.onchange=()=>{theme=th.value;applyTheme(theme);try{localStorage.setItem('lib-theme',theme)}catch(e){}};
  o.onclick=e=>{if(e.target===o||e.target.hasAttribute('data-x'))o.remove()};
  o.onkeydown=e=>{if(e.key==='Escape')o.remove()};
  o.querySelector('[data-x]').focus();
}
let coverFor=null;
function imgToCover(file){return new Promise((res,rej)=>{
  const rd=new FileReader();
  rd.onerror=()=>rej(new Error('Couldn’t read that image.'));
  rd.onload=()=>{const im=new Image();
    im.onerror=()=>rej(new Error('That file isn’t an image I can open.'));
    im.onload=()=>{const s=Math.min(1,720/Math.max(im.width,im.height)),w=Math.round(im.width*s),h=Math.round(im.height*s),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',.85))};
    im.src=rd.result};
  rd.readAsDataURL(file)})}
document.addEventListener('change',async e=>{
  if(e.target.id!=='covpick')return;
  const f=e.target.files[0];e.target.value='';
  const t=topics.find(x=>x.id===coverFor);if(!f||!t)return;
  try{t.cover=await imgToCover(f);await put('topics',t);render();toast('Cover updated.')}catch(err){toast(err.message)}
});
async function getSample(){try{return window.claude&&claude.use?await claude.use('sample'):null}catch(e){return null}}
async function extractText(blob,onProg){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise;
  const N=pdf.numPages,pages=[];
  for(let i=1;i<=Math.min(N,800);i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();pages.push(tc.items.map(x=>x.str).join(' ').replace(/\s+/g,' ').trim());if(i%20===0)onProg(`Reading page ${i} of ${N}…`)}
  pdf.destroy();
  const total=pages.reduce((s,p)=>s+p.length,0),BUDGET=150000;
  const k=total>BUDGET?Math.ceil(total/BUDGET):1;
  return {text:pages.filter((_,i)=>i%k===0).join('\n'),k};
}
const getKey=()=>{try{return localStorage.getItem('lib-key')||''}catch(e){return ''}};
async function askKey(key,prompt){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-5-5',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
  const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||'The request failed.');
  return {text:j.content.map(c=>c.text||'').join('')};
}
async function localSummary(text,show){
  try{
    if('Summarizer' in self&&(await Summarizer.availability())!=='unavailable'){
      show('Preparing the on-device AI. The first time, it downloads a model…');
      const s=await Summarizer.create({type:'key-points',format:'plain-text',length:'long',monitor(m){m.addEventListener('downloadprogress',e=>show(`Downloading the on-device AI: ${Math.round(e.loaded*100)}%`))}});
      const chunks=[];for(let i=0;i<text.length;i+=8000)chunks.push(text.slice(i,i+8000));
      const use=chunks.filter((_,i)=>i%Math.ceil(chunks.length/12)===0),out=[];
      for(let i=0;i<use.length;i++){show(`Summarising part ${i+1} of ${use.length}…`);out.push(await s.summarize(use[i]))}
      return out.join('\n\n');
    }
  }catch(e){}
  show('Summarising…');
  return extractive(text);
}
function extractive(text){
  const stop=new Set('the a an and or of to in is are was were be been for on with as by at from that this it its into than then so such not no can will would should may might also more most other which who what when where how why you your we our they their there these those if but about over under between each any all'.split(' '));
  const words=s=>(s.toLowerCase().match(/[a-z][a-z0-9+#-]{2,}/g)||[]).filter(w=>!stop.has(w));
  const sents=(text.replace(/\s+/g,' ').match(/[^.!?]{25,300}[.!?]/g)||[]).map(s=>s.trim());
  if(sents.length<3)return text.slice(0,1500);
  const freq={};sents.forEach(s=>words(s).forEach(w=>freq[w]=(freq[w]||0)+1));
  const sc=sents.map(s=>{const w=words(s);return w.reduce((a,x)=>a+freq[x],0)/Math.sqrt(w.length||1)});
  const G=Math.min(10,Math.ceil(sents.length/8)),size=Math.ceil(sents.length/G),pick=[];
  for(let g=0;g<G;g++){const idx=[];for(let i=g*size;i<Math.min(sents.length,(g+1)*size);i++)idx.push(i);idx.sort((a,b)=>sc[b]-sc[a]);pick.push(...idx.slice(0,2))}
  return 'Key points from the book:\n\n'+pick.sort((a,b)=>a-b).map(i=>'- '+sents[i]).join('\n')+'\n\nThis summary was built on your device by picking the most important sentences. Add a Claude API key in Settings for a written AI summary.';
}
async function runSummary(n,panel,redo){
  const show=(t,done)=>{panel.hidden=false;panel.innerHTML=done?`<div class="sumtext">${esc(t)}</div><div class="sumbar"><button class="btn" data-copy>Copy</button><button class="btn" data-redo>Summarise again</button></div>`:`<p class="sub" role="status">${esc(t)}</p>`};
  if(n.summary&&!redo){show(n.summary,true);return}
  const sample=await getSample();
  const key=getKey();
  if(!window.pdfjsLib){show('Couldn’t load the PDF reader. Check your internet connection and try again.');return}
  try{
    const rec=await getOne('blobs',n.id);show('Reading the book…');
    const {text,k}=await extractText(rec.blob,t=>show(t));
    if(text.length<300){show('This PDF has no readable text. It may be a scan.');return}
    if(!sample&&!key){const s=await localSummary(text,show);n.summary=s.trim()+(k>1?`\n\nNote: this is a long book, so about every ${k}th page was read.`:'');await put('nodes',n);show(n.summary,true);return}
    const ask=sample||(p=>askKey(key,p));
    const chunks=[];for(let i=0;i<text.length;i+=25000)chunks.push(text.slice(i,i+25000));
    const parts=[];
    for(let i=0;i<chunks.length;i++){show(`Summarising part ${i+1} of ${chunks.length}…`);const r=await ask(`Summarise this section of the book "${n.name}" in under 200 words. Keep the key ideas, terms and examples.\n\n${chunks[i]}`);parts.push(r.text)}
    show('Writing the final summary…');
    const f=await ask(`Below are summaries of consecutive sections of the book "${n.name}". Write one clear summary of the whole book in plain text with no markdown symbols. Use this order: a 2 to 3 sentence overview, then a line "Main ideas" followed by short lines that start with "- ", then a line "Who it is for" with one sentence.\n\n${parts.join('\n\n')}`);
    n.summary=f.text.trim()+(k>1?`\n\nNote: this is a long book, so about every ${k}th page was read.`:'');
    await put('nodes',n);show(n.summary,true);
  }catch(e){show(e&&e.code==='rate_limited'?'Too many requests. Try again in a minute.':'Couldn’t summarise this book. '+((e&&e.message)||''))}
}
addEventListener('unhandledrejection',e=>toast('Something went wrong: '+((e.reason&&e.reason.message)||e.reason)));
addEventListener('error',e=>toast('Something went wrong: '+e.message));
(async()=>{topics=(await getAll('topics')).sort((a,b)=>a.created-b.created);nodes=await getAll('nodes');render()})();
